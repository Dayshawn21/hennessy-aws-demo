name: Deploy to AWS

# Manual only until one run has succeeded. Then add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token for AWS

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  S3_BUCKET: hennessy-demo-dt-48213
  CLOUDFRONT_DISTRIBUTION_ID: EMU8N0CEG5PZL

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:sites

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync dist/client to S3
        run: aws s3 sync dist/client "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
